# Render blueprint for the RetinaTrace prototype, used for the live deployment at https://retinatrace-cv-coursework-cobsccomp24-2p.onrender.com/
# Render sets PORT; app/main.py listens on it (PORT, then GRADIO_SERVER_PORT, then 7860).
#
# Memory: the free plan (512 MB) is too small. The app peaks at about 1.6 GB while it loads
# EfficientNetB3 and the U-Net and analyses an image, so choose a plan with at least 2 GB of RAM.
services:
  - type: web
    name: retinatrace
    runtime: docker  # replaces the deprecated env field
    dockerfilePath: ./Dockerfile
    plan: standard  # 2 GB RAM; do not use the free plan
    healthCheckPath: /
    autoDeploy: false
